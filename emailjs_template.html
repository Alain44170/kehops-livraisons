<!-- Template HTML EmailJS — copiez-collez dans le template HTML sur dashboard EmailJS -->
<div>
  <p><strong>Nom :</strong> {{name}}</p>
  <p><strong>Téléphone :</strong> {{phone}}</p>
  <p><strong>Adresse :</strong> {{address}}</p>
  <p><strong>Contenu réel de la commande :</strong></p>
  <p>{{shopping_list}}</p>
  <p><strong>Message :</strong></p>
  <p>{{message}}</p>

  <!-- Insérez ceci juste avant la fermeture de la div principale -->
  <p><strong>Photo de la carte :</strong></p>

  <p>
    <a href="{{image_url}}" target="_blank">
      Voir la photo
    </a>
  </p>

  <img src="{{image_url}}" style="max-width:300px;border-radius:10px;" />

</div>

<!-- Fin du template -->
