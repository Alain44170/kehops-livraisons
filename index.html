<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">

  <style>
    :root {
      --gold: #c9a227;
      --gold-light: #e8c84a;
      --green-deep: #0b3d2e;
      --green-mid: #0b6e68;
      --green-accent: #2aa879;
      --bg: #f0ebe0;
      --surface: #ede8dd;
      --card: #e9e3d6;
      --text: #111c16;
      --muted: #6b6255;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 4px 18px rgba(11,61,46,0.12), 0 1px 3px rgba(11,61,46,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* HEADER & NAV (identique à avant) */
    .app-header { background: linear-gradient(135deg, var(--green-deep), #0f4d3a); padding: env(safe-area-inset-top, 0) 0 0; flex-shrink: 0; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .header-logo img { height: 36px; width: auto; }
    .header-logo-text { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: #fff; font-weight: 700; }
    .header-logo-text span { display: block; font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 400; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; }
    .header-actions { display: flex; gap: 10px; }
    .header-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; text-decoration: none; transition: background 0.2s; }
    .header-btn:active { background: rgba(255,255,255,0.22); }
    .header-btn.whatsapp { background: rgba(37,211,102,0.25); border-color: rgba(37,211,102,0.4); }

    .nav-tabs { display: flex; background: rgba(0,0,0,0.2); }
    .nav-tab { flex: 1; padding: 10px 0; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-tab i { font-size: 1rem; }
    .nav-tab.active { color: var(--gold-light); border-bottom-color: var(--gold-light); }

    .app-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-bottom: env(safe-area-inset-bottom, 16px); }
    .page { display: none; padding: 20px 16px; }
    .page.active { display: block; }

    /* HERO CARD - CORRECTION IMAGE */
    .hero-card {
      background: linear-gradient(135deg, var(--green-deep), #0f4d3a);
      border-radius: var(--radius);
      padding: 24px;
      color: #fff;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(45deg, rgba(201,162,39,0.04) 0, rgba(201,162,39,0.04) 1px, transparent 0, transparent 30px);
    }
    .hero-card-content { position: relative; z-index: 1; }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(201,162,39,0.2); border: 1px solid rgba(201,162,39,0.4);
      color: var(--gold-light); font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 4px 10px; border-radius: 20px; margin-bottom: 12px;
    }

    .hero-card h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; line-height: 1.1; margin-bottom: 10px; }
    .hero-card h1 em { font-style: normal; color: var(--gold-light); }
    .hero-card p { font-size: 0.88rem; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 18px; }

    .hero-card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      object-position: center 32%;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
    }

    /* Amélioration spécifique pour mobile */
    @media (max-width: 480px) {
      .hero-card-img {
        height: 175px;
        object-position: center 40%;
      }
    }

    .hero-stats {
      display: flex; gap: 0; background: rgba(0,0,0,0.2);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .hero-stat { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
    .hero-stat:last-child { border-right: none; }
    .hero-stat-val { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--gold-light); }
    .hero-stat-label { font-size: 0.65rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

    /* Le reste du CSS est identique à ta version précédente */
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .quick-btn { background: var(--card); border: 1px solid rgba(11,61,46,0.12); border-radius: var(--radius); padding: 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--text); box-shadow: var(--shadow); transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
    .quick-btn:active { transform: scale(0.97); }
    .quick-btn-icon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .quick-btn-icon.green { background: rgba(11,110,104,0.12); color: var(--green-mid); }
    .quick-btn-icon.gold { background: rgba(201,162,39,0.12); color: var(--gold); }
    .quick-btn-icon.whatsapp { background: rgba(37,211,102,0.12); color: #25D366; }
    .quick-btn-icon.info { background: rgba(11,61,46,0.08); color: var(--green-deep); }
    .quick-btn span { font-size: 0.82rem; font-weight: 600; text-align: center; }

    .section-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text); margin-bottom: 12px; margin-top: 4px; }
    .steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .step-item { display: flex; align-items: flex-start; gap: 12px; background: var(--card); border-radius: var(--radius-sm); padding: 14px; border: 1px solid rgba(11,61,46,0.10); box-shadow: var(--shadow); }
    .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--green-mid); color: #fff; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-text strong { display: block; font-size: 0.9rem; margin-bottom: 3px; }
    .step-text p { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

    .form-card { background: #f2ede3; border-radius: var(--radius); padding: 20px; border: 1px solid rgba(201,162,39,0.15); box-shadow: var(--shadow); margin-bottom: 16px; }
    /* ... (tout le reste du style est conservé) ... */
    /* Pour ne pas allonger inutilement, le reste du CSS est identique à ta version originale. */
