  <style>
    /* ============================================================
       KHÉOPS LIVRAISONS — Charte Saint-Brévin
       Sable · Bleu nuit · Or ocre
       ============================================================ */
    :root{
      --encre:#1b2733;       /* bleu nuit océan — texte & fonds sombres */
      --encre-soft:#33414e;
      --ecume:#f7f4ee;       /* sable clair — fond principal */
      --sable:#e9e2d3;       /* cartes / hover */
      --sable-line:#ddd4c4;
      --ocre:#c8902e;        /* or ocre — accent unique */
      --ocre-dark:#a87722;
      --ardoise:#5b6b7a;     /* texte secondaire */
      --vert:#2e7d52;        /* confiance / validation */
      --blanc:#ffffff;
      --shadow:0 8px 24px rgba(27,39,51,.10);
      --shadow-lg:0 18px 50px rgba(27,39,51,.18);
      --font-display:'Fraunces', Georgia, serif;
      --font-body:'DM Sans', system-ui, -apple-system, sans-serif;
      --maxw:1140px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      font-family:var(--font-body);
      background:var(--ecume);
      color:var(--encre);
      line-height:1.6;
      overflow-x:hidden;
    }
    h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.18;letter-spacing:-.01em}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .container{max-width:var(--maxw);margin:0 auto;padding:0 22px}
    section{position:relative}

    /* ---------- Boutons ---------- */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      font-family:var(--font-body);font-weight:700;font-size:1rem;
      border:none;border-radius:999px;padding:14px 28px;cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
      white-space:nowrap;
    }
    .btn-gold{background:var(--ocre);color:var(--encre);box-shadow:0 6px 18px rgba(200,144,46,.32)}
    .btn-gold:hover{filter:brightness(1.07);transform:translateY(-2px)}
    .btn-dark{background:var(--encre);color:var(--blanc)}
    .btn-dark:hover{background:#11202c;transform:translateY(-2px)}
    .btn-outline{background:transparent;border:1.6px solid var(--sable-line);color:var(--encre)}
    .btn-outline:hover{background:var(--sable)}
    .btn-block{width:100%}

    /* ---------- Barre de langue + nav ---------- */
    .topbar{
      position:sticky;top:0;z-index:900;
      background:rgba(247,244,238,.88);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--sable-line);
    }
    .topbar-inner{
      max-width:var(--maxw);margin:0 auto;padding:10px 22px;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:38px;height:38px;border-radius:9px;object-fit:cover}
    .brand-name{font-family:var(--font-display);font-weight:800;font-size:1.12rem;color:var(--encre)}
    .brand-name small{display:block;font-family:var(--font-body);font-weight:600;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ocre);margin-top:-2px}

    .nav-desktop{display:flex;align-items:center;gap:26px}
    .nav-desktop a{font-weight:600;font-size:.92rem;color:var(--encre-soft);transition:color .15s}
    .nav-desktop a:hover{color:var(--ocre)}

    .langues{display:flex;gap:6px}
    .btn-langue{
      background:var(--blanc);border:1.4px solid var(--sable-line);color:var(--encre);
      font-weight:600;font-size:.8rem;border-radius:999px;padding:7px 14px;cursor:pointer;
      transition:border-color .15s, background .15s;
    }
    .btn-langue:hover{border-color:var(--ocre)}
    .btn-langue.actif{background:var(--encre);color:var(--ocre);border-color:var(--encre)}

    .burger{display:none;background:none;border:none;font-size:1.4rem;color:var(--encre);cursor:pointer}

    /* ---------- HERO ---------- */
    .hero{
      background:
        radial-gradient(1200px 500px at 80% -10%, rgba(200,144,46,.12), transparent 60%),
        linear-gradient(160deg, #1b2733 0%, #223240 55%, #1b2733 100%);
      color:var(--blanc);
      padding:64px 0 76px;
      overflow:hidden;
    }
    .hero::before{
      content:"";position:absolute;inset:0;opacity:.06;
      background-image:repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 26px);
      pointer-events:none;
    }
    .hero-grid{
      position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:46px;align-items:center;
    }
    .hero-eyebrow{
      display:inline-flex;align-items:center;gap:9px;
      background:rgba(200,144,46,.14);border:1px solid rgba(200,144,46,.34);
      color:var(--ocre);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
      padding:7px 15px;border-radius:999px;margin-bottom:20px;
    }
    .hero h1{font-size:clamp(2rem,4.4vw,3.1rem);color:var(--blanc);margin-bottom:18px}
    .hero h1 .accent{color:var(--ocre)}
    .hero-lead{font-size:1.12rem;color:rgba(255,255,255,.82);margin-bottom:26px;max-width:30em}
    .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
    .hero-trust{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.7);font-size:.9rem;font-weight:500}
    .hero-trust i{color:var(--vert);background:rgba(46,125,82,.16);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}

    /* Carte prix flottante */
    .hero-card{
      background:var(--blanc);color:var(--encre);border-radius:20px;
      padding:30px 28px;box-shadow:var(--shadow-lg);
    }
    .hero-card .pyramide{width:0;height:0;margin:0 auto 14px;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:28px solid var(--ocre)}
    .hero-card .label{text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ardoise)}
    .hero-card .prix{text-align:center;font-family:var(--font-display);font-weight:800;font-size:3.6rem;color:var(--encre);line-height:1;margin:6px 0 2px}
    .hero-card .prix small{display:block;font-family:var(--font-body);font-size:.92rem;font-weight:600;color:var(--ardoise);margin-top:8px}
    .hero-card ul{list-style:none;margin:22px 0 24px;display:flex;flex-direction:column;gap:11px}
    .hero-card li{display:flex;align-items:flex-start;gap:11px;font-size:.94rem;color:var(--encre-soft)}
    .hero-card li i{color:var(--vert);margin-top:3px;flex-shrink:0}

    /* ---------- Sections génériques ---------- */
    .section{padding:74px 0}
    .section.alt{background:var(--blanc)}
    .section-head{text-align:center;max-width:680px;margin:0 auto 48px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ocre);margin-bottom:14px}
    .eyebrow::before,.eyebrow::after{content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid var(--ocre)}
    .section-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);margin-bottom:12px}
    .section-head p{color:var(--ardoise);font-size:1.06rem}

    /* ---------- Grille services ---------- */
    .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .svc{
      background:var(--blanc);border:1px solid var(--sable-line);border-radius:16px;
      padding:26px 22px;display:flex;flex-direction:column;gap:12px;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .section.alt .svc{background:var(--ecume)}
    .svc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .svc .ic{width:48px;height:48px;border-radius:13px;background:var(--ecume);display:flex;align-items:center;justify-content:center;color:var(--encre);font-size:1.3rem}
    .section.alt .svc .ic{background:var(--blanc)}
    .svc h3{font-size:1.08rem}
    .svc p{font-size:.92rem;color:var(--ardoise);flex-grow:1}
    .svc .tag{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ocre)}

    /* ---------- Promesse confiance ---------- */
    .promise{
      display:flex;align-items:center;justify-content:center;gap:11px;text-align:center;
      background:var(--blanc);border:1.6px solid var(--vert);color:var(--vert);
      font-weight:700;font-size:.98rem;border-radius:999px;padding:13px 26px;
      width:max-content;max-width:100%;margin:40px auto 0;
    }
    .promise i{flex-shrink:0}

    /* ---------- Parcours ---------- */
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px}
    .step{position:relative;padding-left:58px}
    .step .n{position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;background:var(--encre);color:var(--ocre);font-weight:800;font-size:1.15rem;display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}
    .step h4{font-size:1.05rem;margin-bottom:5px}
    .step p{font-size:.92rem;color:var(--ardoise)}
    .step p strong{color:var(--encre-soft)}
    .note{margin-top:30px;background:var(--ecume);border-radius:13px;padding:16px 20px;font-size:.9rem;color:var(--ardoise);display:flex;gap:11px;align-items:flex-start}
    .section.alt .note{background:var(--blanc)}
    .note i{color:var(--ocre);margin-top:3px;flex-shrink:0}

    /* ---------- FAQ ---------- */
    .faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
    .faq details{background:var(--blanc);border:1px solid var(--sable-line);border-radius:13px;padding:4px 20px;transition:box-shadow .15s}
    .section.alt .faq details{background:var(--ecume)}
    .faq summary{cursor:pointer;font-weight:700;font-size:1rem;padding:16px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
    .faq summary::-webkit-details-marker{display:none}
    .faq summary::after{content:"+";color:var(--ocre);font-size:1.5rem;font-weight:400;transition:transform .2s}
    .faq details[open] summary::after{transform:rotate(45deg)}
    .faq details p{padding:0 0 18px;color:var(--ardoise);font-size:.94rem}

    /* ---------- Bandeau CTA ---------- */
    .cta-band{background:var(--encre);color:var(--blanc);border-radius:22px;padding:46px 40px;text-align:center;max-width:var(--maxw);margin:0 auto}
    .cta-band h2{color:var(--blanc);font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:10px}
    .cta-band p{color:rgba(255,255,255,.74);margin-bottom:26px;font-size:1.05rem}

    /* ---------- Footer ---------- */
    .footer{background:var(--encre);color:rgba(255,255,255,.66);padding:54px 0 28px;margin-top:0}
    .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px;margin-bottom:34px}
    .footer .brand-name{color:var(--blanc)}
    .footer h5{color:var(--blanc);font-family:var(--font-body);font-weight:700;font-size:.92rem;letter-spacing:.04em;margin-bottom:14px;text-transform:uppercase}
    .footer ul{list-style:none;display:flex;flex-direction:column;gap:9px}
    .footer ul a{font-size:.92rem;color:rgba(255,255,255,.66);transition:color .15s}
    .footer ul a:hover{color:var(--ocre)}
    .footer-about p{font-size:.92rem;margin-top:12px;max-width:30em}
    .footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:20px;font-size:.82rem;color:rgba(255,255,255,.5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

    /* ============================================================
       FORMULAIRES (section contact)
       ============================================================ */
    .forms-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .fcard{background:var(--blanc);border:1px solid var(--sable-line);border-radius:18px;padding:30px 28px;box-shadow:var(--shadow)}
    .fcard > h3{font-size:1.3rem;margin-bottom:6px;display:flex;align-items:center;gap:10px}
    .fcard > h3 .pico{width:34px;height:34px;border-radius:9px;background:var(--ecume);display:flex;align-items:center;justify-content:center;color:var(--ocre);font-size:.95rem}
    .fcard .fsub{color:var(--ardoise);font-size:.9rem;margin-bottom:20px}
    .fld{margin-bottom:14px}
    .fld label{display:block;font-weight:600;font-size:.86rem;color:var(--encre-soft);margin-bottom:6px}
    .fld input,.fld textarea,.fld select{
      width:100%;border:1.5px solid var(--sable-line);border-radius:10px;background:var(--ecume);
      padding:12px 14px;font-size:.96rem;font-family:inherit;color:var(--encre);outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--ocre);box-shadow:0 0 0 3px rgba(200,144,46,.14);background:var(--blanc)}
    .fld textarea{resize:vertical;min-height:84px}
    .fld .hint{font-size:.78rem;color:var(--ardoise);margin-top:5px}
    .fld-msg{font-size:.8rem;margin-top:5px;min-height:16px}

    /* Cartes de service (type de livraison) */
    .svc-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .svc-opt{position:relative;border:1.5px solid var(--sable-line);border-radius:12px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;transition:border-color .15s, background .15s}
    .svc-opt:hover{border-color:var(--ocre)}
    .svc-opt input{position:absolute;opacity:0;pointer-events:none}
    .svc-opt .emo{font-size:1.3rem}
    .svc-opt strong{font-size:.86rem}
    .svc-opt span{font-size:.74rem;color:var(--ardoise);line-height:1.4}
    .svc-opt.sel{border-color:var(--ocre);background:rgba(200,144,46,.07)}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    /* Checkbox CGL */
    .chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
    .chk input{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--ocre)}
    .chk label{font-size:.85rem;color:var(--ardoise);font-weight:500}
    .chk a{color:var(--ocre);font-weight:700;text-decoration:underline}

    /* Bloc paiement */
    .pay-box{background:var(--ecume);border:1px solid var(--sable-line);border-radius:14px;padding:18px;margin:16px 0}
    .pay-box .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .pay-box .row strong{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ardoise)}
    .pay-box .amount{font-family:var(--font-display);font-weight:800;font-size:1.7rem;color:var(--encre)}
    .pay-link{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--ocre);color:var(--encre);font-weight:800;border-radius:10px;padding:14px;margin-bottom:10px;transition:filter .15s}
    .pay-link:hover{filter:brightness(1.07)}
    .pay-secure{font-size:.76rem;color:var(--ardoise);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}

    /* Message d'info drive */
    .drive-info{background:var(--encre);border:1.5px solid var(--ocre);border-radius:14px;padding:18px 20px;margin-bottom:20px;display:flex;gap:13px;align-items:flex-start}
    .drive-info .emo{font-size:1.5rem;flex-shrink:0}
    .drive-info strong{color:var(--ocre);display:block;font-size:.98rem;margin-bottom:7px}
    .drive-info p{color:rgba(255,255,255,.86);font-size:.87rem;line-height:1.6}
    .drive-info a{display:inline-flex;align-items:center;gap:7px;background:var(--ocre);color:var(--encre);padding:9px 16px;border-radius:9px;font-weight:700;font-size:.82rem;margin-top:11px}

    .form-msg{font-size:.9rem;margin-top:12px;min-height:18px;font-weight:600}

    /* ---------- Modale ---------- */
    .modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(27,39,51,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
    .modal.open{display:flex}
    .modal-box{background:var(--blanc);border-radius:16px;max-width:680px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
    .modal-head{background:var(--encre);border-radius:16px 16px 0 0;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
    .modal-head h3{color:var(--ocre);font-size:1.15rem}
    .modal-head button{background:none;border:none;color:rgba(255,255,255,.7);font-size:1.4rem;cursor:pointer;line-height:1}
    .modal-body{padding:24px 28px}
    .modal-body h4{color:var(--encre);margin:20px 0 7px;font-size:1.02rem;font-family:var(--font-display)}
    .modal-body h4:first-child{margin-top:0}
    .modal-body p,.modal-body li{font-size:.92rem;color:var(--encre-soft);margin-bottom:10px;line-height:1.65}
    .modal-body ul{padding-left:20px}
    .modal-foot{position:sticky;bottom:0;background:var(--blanc);border-top:1px solid var(--sable-line);padding:16px 28px;border-radius:0 0 16px 16px}
    .btn-accept-cgl{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--vert);color:#fff;font-family:var(--font-body);font-weight:800;font-size:1rem;border:none;border-radius:999px;padding:14px;cursor:pointer;transition:filter .15s, transform .15s;box-shadow:0 6px 18px rgba(46,125,82,.28)}
    .btn-accept-cgl:hover{filter:brightness(1.08);transform:translateY(-2px)}

    /* ---------- Reveal ---------- */
    .reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease, transform .6s ease}
    .reveal.visible{opacity:1;transform:none}

    /* ---------- Map ---------- */
    .map-wrap{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);height:380px}
    .map-wrap iframe{width:100%;height:100%;border:0}

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width:920px){
      .hero-grid{grid-template-columns:1fr;gap:34px}
      .hero-card{max-width:420px}
      .services-grid{grid-template-columns:repeat(2,1fr)}

      .forms-wrap{grid-template-columns:1fr}
      .footer-grid{grid-template-columns:1fr 1fr}

    }
    @media (max-width:560px){

    .mobile-menu a:hover{background:var(--sable)}

    cgl_body:`<h4>1. Gegenstand</h4><p>Khéops Livraisons ist ein lokaler Transportdienst in Saint-Brévin-les-Pins. Ich hole Waren ab und liefere sie, die Sie bereits in einem Geschäft bestellt und/oder bezahlt haben. Ich kaufe kein Produkt für Sie ein und strecke kein Geld vor.</p>

  /* ===================== GESTION LANGUE ===================== */
  function setLang(lang){
    const d = I18N[lang]; if(!d) return;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k = el.getAttribute('data-i18n');
      if(d[k]!==undefined) el.textContent = d[k];
    });
    document.querySelectorAll('.btn-langue').forEach(b=>{
      b.classList.toggle('actif', b.getAttribute('data-lang')===lang);
    });
    // CGL (HTML)
    const cgl = document.getElementById('cgl-content');
    if(cgl) cgl.innerHTML = d.cgl_body;
    try{ localStorage.setItem('kheops_lang', lang); }catch(e){}
  }
  function closeMobile(){ document.getElementById('mobileMenu').classList.remove('open'); }

  /* ===================== MODALE CGL ===================== */
  function openCGL(e){ if(e) e.preventDefault(); document.getElementById('cgl-modal').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeCGL(){ document.getElementById('cgl-modal').classList.remove('open'); document.body.style.overflow=''; }
  function accepterCGL(){
    var chk=document.getElementById('paidConfirm');
    if(chk){ chk.checked=true; }
    closeCGL();
  }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeCGL(); });
  document.getElementById('cgl-modal').addEventListener('click', function(e){ if(e.target===this) closeCGL(); });

  /* ===================== INIT ===================== */
  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('year').textContent = new Date().getFullYear();
    let saved='fr'; try{ saved = localStorage.getItem('kheops_lang')||'fr'; }catch(e){}
    setLang(saved);

    // Reveal au scroll
    const obs = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting) en.target.classList.add('visible'); }),{threshold:0.12});
    document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

    // Sélection visuelle des cartes de service
    document.querySelectorAll('.svc-opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        document.querySelectorAll('.svc-opt').forEach(o=>o.classList.remove('sel'));
        opt.classList.add('sel');
        const r = opt.querySelector('input'); if(r) r.checked = true;
      });
    });

    // EmailJS
    const SERVICE_ID='service_sxo3uwm', TEMPLATE_ID='template_6w6vi39', PUBLIC_KEY='NuHxu96_U_IxWB1TO';
    try{ if(typeof emailjs!=='undefined' && PUBLIC_KEY) emailjs.init(PUBLIC_KEY); }catch(e){}

    /* ---------- Formulaire DEMANDE DE LIVRAISON ---------- */
    const form = document.getElementById('delivery-form');
    const formMsg = document.getElementById('formMsg');
    const submitBtn = document.getElementById('submitBtn');

    /* ════════════════════════════════════════════════════════════════════
       INTERRUPTEUR « SITE EN CONSTRUCTION »
       Tant que true : paiement ET envoi de commande BLOQUÉS (alerte affichée).
       👉 Pour OUVRIR le site quand tu es opérationnel : passer à false.
       ════════════════════════════════════════════════════════════════════ */
    var SITE_EN_CONSTRUCTION = true;

    function alerteConstruction(){
      var lang=document.documentElement.lang||'fr';
      var m={
        fr:'🚧 Le site est en cours de finalisation : les commandes et paiements ne sont pas encore disponibles. Merci de revenir dans quelques jours !',
        en:'🚧 The website is being finalised: orders and payments are not available yet. Please come back in a few days!',
        es:'🚧 El sitio se está finalizando: los pedidos y pagos aún no están disponibles. ¡Vuelva en unos días!',
        de:'🚧 Die Website wird fertiggestellt: Bestellungen und Zahlungen sind noch nicht verfügbar. Bitte kommen Sie in ein paar Tagen wieder!'
      }[lang];
      formMsg.textContent=m; formMsg.style.color='#c8902e'; formMsg.style.fontWeight='700';
      formMsg.scrollIntoView({behavior:'smooth',block:'center'});
    }

    /* ========== VALIDATION PARTAGÉE (submit ET paiement Stripe) ==========
       Retourne true si tout est valide, false sinon (et affiche le message). */
    window.validerCommande = function(scrollToField){
      var lang=document.documentElement.lang||'fr';
      var g=function(id){var el=document.getElementById(id);return el?el.value.trim():'';};
      var service=(document.querySelector('input[name=serviceType]:checked')||{}).value||'';
      var name=g('name'),email=g('email'),address=g('address'),shop=g('shop_name'),list=g('shopping_list');
      var pd=g('pickup_date'),pt=g('pickup_time'),dd=g('delivery_date'),dt=g('delivery_time');
      var paid=document.getElementById('paidConfirm').checked;
      var show=function(txt,fieldId){
        formMsg.textContent=txt; formMsg.style.color='#c0392b';
        if(scrollToField && fieldId){ var el=document.getElementById(fieldId); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }
      };

      // ── PRIORITÉ 1 : horaires saisis mais hors plage (9h–19h) ──
      // (vérifié en premier pour amener le client directement aux créneaux)
      var hm=function(h){var p=(h||'').split(':');return p.length===2?parseInt(p[0],10)*60+parseInt(p[1],10):-1;};
      var OUV=9*60, FERM=19*60, ptM=hm(pt), dtM=hm(dt);
      var hMsg={fr:'🕘 Créneau hors horaires : je travaille de 9h à 19h, du lundi au samedi. Corrigez les heures surlignées ci-dessous.',en:'🕘 Slot outside hours: I work 9am–7pm, Monday to Saturday. Please fix the highlighted times below.',es:'🕘 Franja fuera de horario: trabajo de 9h a 19h, de lunes a sábado. Corrija las horas señaladas abajo.',de:'🕘 Zeitfenster außerhalb der Zeiten: ich arbeite 9–19 Uhr, Montag bis Samstag. Bitte korrigieren Sie die markierten Zeiten unten.'}[lang];
      var ptHorsPlage = (pt!=='' && (ptM<OUV||ptM>FERM));
      var dtHorsPlage = (dt!=='' && (dtM<OUV||dtM>FERM));
      if(ptHorsPlage || dtHorsPlage){
        if(typeof verifierHeure==='function'){
          if(ptHorsPlage) verifierHeure('pickup_time','pickup-time-msg');
          if(dtHorsPlage) verifierHeure('delivery_time','delivery-time-msg');
        }
        show(hMsg, ptHorsPlage?'pickup_time':'delivery_time');
        return false;
      }

      // ── PRIORITÉ 2 : champs requis — scroll vers le PREMIER champ vide ──
      var fillMsg={fr:'Veuillez compléter tous les champs requis avant de payer.',en:'Please complete all required fields before paying.',es:'Complete todos los campos obligatorios antes de pagar.',de:'Bitte füllen Sie alle Pflichtfelder aus, bevor Sie bezahlen.'}[lang];
      var requis=[['serviceType_check',!service,'service-grid'],['name',!name,'name'],['email',!email,'email'],['address',!address,'address'],['shop_name',!shop,'shop_name'],['shopping_list',!list,'shopping_list'],['pickup_date',!pd,'pickup_date'],['pickup_time',!pt,'pickup_time'],['delivery_date',!dd,'delivery_date'],['delivery_time',!dt,'delivery_time'],['paidConfirm',!paid,'paidConfirm']];
      for(var i=0;i<requis.length;i++){
        if(requis[i][1]){ show(fillMsg, requis[i][2]); return false; }
      }

      // ── PRIORITÉ 3 : zone (les 2 adresses à Saint-Brévin) — seulement si Google a répondu ──
      var googleReady=!!(window.google&&window.google.maps&&window.google.maps.places);
      var ozLivr={fr:'🚫 Adresse de livraison hors zone : choisissez une adresse à Saint-Brévin-les-Pins (44250) dans la liste.',en:'🚫 Delivery address out of area: pick a Saint-Brévin-les-Pins (44250) address from the list.',es:'🚫 Dirección de entrega fuera de zona: elija una dirección de Saint-Brévin-les-Pins (44250) en la lista.',de:'🚫 Lieferadresse außerhalb der Zone: wählen Sie eine Adresse in Saint-Brévin-les-Pins (44250) aus der Liste.'}[lang];
      var ozShop={fr:'🚫 Lieu de prise en charge hors zone : choisissez une adresse à Saint-Brévin-les-Pins (44250) dans la liste.',en:'🚫 Pickup location out of area: pick a Saint-Brévin-les-Pins (44250) address from the list.',es:'🚫 Lugar de recogida fuera de zona: elija una dirección de Saint-Brévin-les-Pins (44250) en la lista.',de:'🚫 Abholort außerhalb der Zone: wählen Sie eine Adresse in Saint-Brévin-les-Pins (44250) aus der Liste.'}[lang];
      if(googleReady && window.addressValid!==true){ show(ozLivr,'address'); return false; }
      if(googleReady && window.shopValid!==true){ show(ozShop,'shop_name'); return false; }

      return true;
    };

    /* Garde sur le bouton de paiement Stripe : n'ouvre le paiement que si tout est valide */
    window.verifierAvantPaiement = function(e){
      if(SITE_EN_CONSTRUCTION){
        if(e){ e.preventDefault(); }
        alerteConstruction();
        return false;
      }
      if(!window.validerCommande(true)){
        if(e){ e.preventDefault(); }
        return false;
      }
      return true; // laisse le lien Stripe s'ouvrir
    };

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      formMsg.textContent='';
      if(SITE_EN_CONSTRUCTION){ alerteConstruction(); return; }
      const lang=document.documentElement.lang;
      const t={fr:{fill:'Veuillez compléter tous les champs requis.',ok:'✅ Demande envoyée ! Je vous recontacte par email rapidement.',err:'Erreur lors de l\'envoi. Réessayez ou utilisez le formulaire de contact.'},
               en:{fill:'Please complete all required fields.',ok:'✅ Request sent! I\'ll get back to you by email shortly.',err:'Sending error. Try again or use the contact form.'},
               es:{fill:'Por favor complete todos los campos obligatorios.',ok:'✅ ¡Solicitud enviada! Le responderé por email pronto.',err:'Error al enviar. Inténtelo de nuevo o use el formulario de contacto.'},
               de:{fill:'Bitte füllen Sie alle Pflichtfelder aus.',ok:'✅ Anfrage gesendet! Ich melde mich bald per E-Mail.',err:'Fehler beim Senden. Versuchen Sie es erneut oder nutzen Sie das Kontaktformular.'}}[lang];
      const get=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
      const service=(document.querySelector('input[name=serviceType]:checked')||{}).value||'';
      const name=get('name'),email=get('email'),address=get('address'),shop=get('shop_name'),list=get('shopping_list');
      const pd=get('pickup_date'),pt=get('pickup_time'),dd=get('delivery_date'),dt=get('delivery_time');
      const msg=get('message'),paid=document.getElementById('paidConfirm').checked;
      // Validation partagée (mêmes règles que le bouton de paiement)
      if(!window.validerCommande(true)){ return; }
      submitBtn.setAttribute('disabled','disabled');
      const params={ name, email, phone:'(non communiqué)', address, shop_name:shop, shopping_list:list,
        message:`Service : ${service}\nPrise en charge : ${pd} ${pt}\nLivraison souhaitée : ${dd} ${dt}\n${msg?('Détails : '+msg):''}` };
      try{
        await emailjs.send(SERVICE_ID,TEMPLATE_ID,params,PUBLIC_KEY);
        form.reset(); document.querySelectorAll('.svc-opt').forEach(o=>o.classList.remove('sel'));
        formMsg.textContent=t.ok; formMsg.style.color='#2e7d52';
      }catch(err){ formMsg.textContent=t.err; formMsg.style.color='#c0392b'; }
      finally{ submitBtn.removeAttribute('disabled'); }
    });

    /* ---------- Formulaire CONTACT ---------- */
    const cform=document.getElementById('contact-form');
    const cmsg=document.getElementById('contactMsg');
    const cbtn=document.getElementById('contactBtn');
    cform.addEventListener('submit', async function(e){
      e.preventDefault(); cmsg.textContent='';
      const lang=document.documentElement.lang;
      const t={fr:{fill:'Veuillez compléter les champs requis.',ok:'✅ Message envoyé ! Je vous réponds par email dès que possible.',err:'Erreur lors de l\'envoi. Réessayez plus tard.'},
               en:{fill:'Please complete the required fields.',ok:'✅ Message sent! I\'ll reply by email as soon as possible.',err:'Sending error. Please try again later.'},
               es:{fill:'Por favor complete los campos obligatorios.',ok:'✅ ¡Mensaje enviado! Le responderé por email lo antes posible.',err:'Error al enviar. Inténtelo más tarde.'},
               de:{fill:'Bitte füllen Sie die Pflichtfelder aus.',ok:'✅ Nachricht gesendet! Ich antworte so bald wie möglich per E-Mail.',err:'Fehler beim Senden. Bitte versuchen Sie es später erneut.'}}[lang];
      const get=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
      const n=get('c_name'),em=get('c_email'),su=get('c_subject'),me=get('c_message');
      if(!n||!em||!me){ cmsg.textContent=t.fill; cmsg.style.color='#c0392b'; return; }
      cbtn.setAttribute('disabled','disabled');
      const params={ name:n, email:em, phone:'—', address:'—', shop_name:'CONTACT'+(su?(' — '+su):''), shopping_list:'(message de contact)', message:me };
      try{
        await emailjs.send(SERVICE_ID,TEMPLATE_ID,params,PUBLIC_KEY);
        cform.reset(); cmsg.textContent=t.ok; cmsg.style.color='#2e7d52';
      }catch(err){ cmsg.textContent=t.err; cmsg.style.color='#c0392b'; }
      finally{ cbtn.removeAttribute('disabled'); }
    });

    /* ---------- Dates min = aujourd'hui ---------- */
    const today=new Date().toISOString().split('T')[0];
    ['pickup_date','delivery_date'].forEach(id=>{const el=document.getElementById(id); if(el) el.min=today;});

    /* ---------- Validation horaire en TEMPS RÉEL (9h–19h) ---------- */
    function verifierHeure(inputId, msgId){
      var el=document.getElementById(inputId), msgEl=document.getElementById(msgId);
      if(!el || !msgEl) return;
      var v=el.value;
      if(!v){ msgEl.textContent=''; return; }
      var p=v.split(':'), m=p.length===2 ? parseInt(p[0],10)*60+parseInt(p[1],10) : -1;
      var lang=document.documentElement.lang||'fr';
      var OK={fr:'✅ Créneau valide.',en:'✅ Valid slot.',es:'✅ Franja válida.',de:'✅ Gültiges Zeitfenster.'};
      var KO={fr:'🕘 En dehors des horaires (9h–19h). Merci de choisir entre 9h et 19h.',en:'🕘 Outside hours (9am–7pm). Please choose between 9am and 7pm.',es:'🕘 Fuera de horario (9h–19h). Elija entre las 9h y las 19h.',de:'🕘 Außerhalb der Zeiten (9–19 Uhr). Bitte zwischen 9 und 19 Uhr wählen.'};
      var ok = (m>=9*60 && m<=19*60);
      msgEl.textContent = ok ? OK[lang] : KO[lang];
      msgEl.style.color = ok ? '#2e7d52' : '#c0392b';
    }
    var ptEl=document.getElementById('pickup_time');
    var dtEl=document.getElementById('delivery_time');
    if(ptEl){ ptEl.addEventListener('change',function(){verifierHeure('pickup_time','pickup-time-msg');});
              ptEl.addEventListener('blur',function(){verifierHeure('pickup_time','pickup-time-msg');}); }
    if(dtEl){ dtEl.addEventListener('change',function(){verifierHeure('delivery_time','delivery-time-msg');});
              dtEl.addEventListener('blur',function(){verifierHeure('delivery_time','delivery-time-msg');}); }

    /* Site en construction : grise visuellement le bouton de paiement */
    if(SITE_EN_CONSTRUCTION){
      var payBtn=document.getElementById('stripe-payment-link');
      if(payBtn){ payBtn.style.opacity='.55'; payBtn.style.filter='grayscale(.4)'; payBtn.style.cursor='not-allowed'; }
    }
  });
  </script>


  <!-- ======================= AUTOCOMPLÉTION ADRESSE (Google Places) ======================= -->
  <style>
    .pac-container{
      border-radius:12px;border:1px solid var(--sable-line);
      box-shadow:0 12px 36px rgba(27,39,51,.16);margin-top:6px;
      font-family:var(--font-body);background:var(--blanc);overflow:hidden;
    }
    .pac-item{padding:10px 14px;cursor:pointer;font-size:.9rem;color:var(--encre-soft);border-top:1px solid var(--ecume)}
    .pac-item:hover,.pac-item-selected{background:rgba(200,144,46,.10)}
    .pac-item-query{font-size:.92rem;color:var(--encre);font-weight:600}
    .pac-icon{display:none}
    .pac-logo:after{margin:4px 8px}
  </style>
  <script>
  (function(){
    var GOOGLE_API_KEY = 'AIzaSyCd1K70U1Ekepsd9TQZLJm0xonFmaK1Nxo';

    // État de validation des deux champs (partagé avec le submit)
    window.addressValid = false;   // adresse de livraison
    window.shopValid    = false;   // lieu de prise en charge

    function loadMaps(){
      if(window.google && window.google.maps && window.google.maps.places){ initAll(); return; }
      var s=document.createElement('script');
      s.src='https://maps.googleapis.com/maps/api/js?key='+GOOGLE_API_KEY+'&libraries=places&language=fr&callback=__initKheopsAutocomplete';
      s.async=true; s.defer=true;
      s.onerror=function(){ console.warn('Google Maps JS non chargé — saisie manuelle active.'); };
      document.head.appendChild(s);
    }
    window.__initKheopsAutocomplete=function(){ initAll(); };

    function lang(){ return document.documentElement.lang||'fr'; }
    var MSG={
      ok:{fr:'✅ Adresse dans la zone de livraison.',en:'✅ Address within the delivery area.',es:'✅ Dirección dentro de la zona de entrega.',de:'✅ Adresse im Liefergebiet.'},
      out:{fr:'🚫 Hors zone : uniquement Saint-Brévin-les-Pins (44250).',en:'🚫 Out of area: only Saint-Brévin-les-Pins (44250).',es:'🚫 Fuera de zona: solo Saint-Brévin-les-Pins (44250).',de:'🚫 Außerhalb der Zone: nur Saint-Brévin-les-Pins (44250).'},
      checking:{fr:'⏳ Vérification de l\'adresse…',en:'⏳ Checking address…',es:'⏳ Verificando la dirección…',de:'⏳ Adresse wird geprüft…'},
      notfound:{fr:'⚠️ Adresse introuvable. Vérifiez l\'orthographe ou choisissez dans la liste.',en:'⚠️ Address not found. Check spelling or pick from the list.',es:'⚠️ Dirección no encontrada. Verifique o elija de la lista.',de:'⚠️ Adresse nicht gefunden. Schreibweise prüfen oder aus der Liste wählen.'},
      local:{fr:'ℹ️ La vérification sera active sur le site en ligne.',en:'ℹ️ Checking will be active on the live site.',es:'ℹ️ La verificación estará activa en el sitio en línea.',de:'ℹ️ Die Prüfung ist auf der Live-Website aktiv.'}
    };

    // Met à jour le verrou de paiement selon l'état des DEUX champs
    function refreshLock(){
      // Si Google Maps n'est pas chargé (ex. clé bridée hors production), on ne verrouille pas :
      // le contrôle final au submit fait office de filet de sécurité.
      var googleReady = !!(window.google && window.google.maps && window.google.maps.places);
      var both = (window.addressValid===true) && (window.shopValid===true);
      var locked = googleReady && !both;
      var pay=document.getElementById('stripe-payment-link');
      var submit=document.getElementById('submitBtn');
      if(pay){ pay.style.opacity=locked?'0.45':'1'; pay.style.pointerEvents=locked?'none':'auto'; }
      if(submit){ submit.disabled=locked; submit.style.opacity=locked?'0.55':'1'; }
    }
    window.refreshKheopsLock = refreshLock;

    function attachAutocomplete(inputId, msgId, validKey){
      var input=document.getElementById(inputId);
      if(!input || input.__acDone) return;
      if(!(window.google && google.maps && google.maps.places)) return;
      input.__acDone=true;

      var bounds=new google.maps.LatLngBounds(
        new google.maps.LatLng(47.2050,-2.2100),
        new google.maps.LatLng(47.2950,-2.1100)
      );
      var ac=new google.maps.places.Autocomplete(input,{
        bounds:bounds, strictBounds:true,
        componentRestrictions:{country:'fr'},
        fields:['formatted_address','geometry','address_components'],
        types:['establishment','geocode']  // commerces ET adresses (utile pour drives/points relais)
      });

      var selectedFromList=false;

      ac.addListener('place_changed',function(){
        var place=ac.getPlace();
        if(!place || !place.geometry){ return; }
        selectedFromList=true;
        if(place.formatted_address) input.value=place.formatted_address;
        var cp='';
        (place.address_components||[]).forEach(function(c){
          if(c.types.indexOf('postal_code')>=0) cp=c.long_name;
        });
        applyZone(msgId, validKey, cp==='44250');
      });

      input.addEventListener('keydown',function(e){ if(e.key==='Enter') e.preventDefault(); });

      // Dès que le client retape, on annule la validation précédente
      input.addEventListener('input',function(){
        selectedFromList=false;
        window[validKey]=false;
        var msgEl=document.getElementById(msgId);
        if(msgEl){ msgEl.textContent=''; }
        refreshLock();
      });

      // FILET DE SÉCURITÉ : adresse tapée à la main sans clic dans la liste
      input.addEventListener('blur',function(){
        setTimeout(function(){
          if(selectedFromList) return;                 // déjà validé par la liste
          var addr=input.value.trim();
          if(addr.length<6){ return; }
          // Vérification Geocoding directe
          var url='https://maps.googleapis.com/maps/api/geocode/json?address='
                +encodeURIComponent(addr)+'&region=fr&key='+GOOGLE_API_KEY;
          var msgEl=document.getElementById(msgId);
          if(msgEl){ msgEl.textContent=MSG.checking[lang()]; msgEl.style.color='#5b6b7a'; }
          fetch(url).then(function(r){return r.json();}).then(function(data){
            if(data.status==='REQUEST_DENIED' || data.error_message){
              // clé bridée (local) → on laisse passer avec message neutre
              applyZone(msgId, validKey, true, true); return;
            }
            if(data.status!=='OK' || !data.results || !data.results.length){
              applyZone(msgId, validKey, false); 
              if(msgEl){ msgEl.textContent=MSG.notfound[lang()]; msgEl.style.color='#c0392b'; }
              return;
            }
            var cp='';
            (data.results[0].address_components||[]).forEach(function(c){
              if(c.types.indexOf('postal_code')>=0) cp=c.long_name;
            });
            applyZone(msgId, validKey, cp==='44250');
          }).catch(function(){ applyZone(msgId, validKey, true, true); });
        },250);
      });
    }

    // Applique l'état de zone à un champ (vert/rouge) et met à jour le verrou
    function applyZone(msgId, validKey, dansZone, neutral){
      var msgEl=document.getElementById(msgId);
      if(msgEl){
        if(neutral){ msgEl.textContent=MSG.local[lang()]; msgEl.style.color='#5b6b7a'; }
        else { msgEl.textContent = dansZone?MSG.ok[lang()]:MSG.out[lang()]; msgEl.style.color = dansZone?'#2e7d52':'#c0392b'; }
      }
      window[validKey]=dansZone;
      refreshLock();
      // Pop-up bloquante si l'adresse est explicitement hors zone
      if(!neutral && !dansZone){ showOutOfZonePopup(msgId); }
    }

    // ── POP-UP HORS ZONE ──
    function showOutOfZonePopup(originMsgId){
      if(document.getElementById('oz-modal')) return;
      var L=lang();
      var T={
        fr:{t:'Vous êtes hors zone',p:'Je livre et récupère uniquement sur la commune de Saint-Brévin-les-Pins (44250). Merci de choisir une adresse dans la liste proposée.',b:'Corriger mon adresse'},
        en:{t:'You are out of area',p:'I only deliver and collect within Saint-Brévin-les-Pins (44250). Please choose an address from the suggested list.',b:'Correct my address'},
        es:{t:'Está fuera de zona',p:'Solo entrego y recojo en Saint-Brévin-les-Pins (44250). Por favor, elija una dirección de la lista propuesta.',b:'Corregir mi dirección'},
        de:{t:'Sie sind außerhalb der Zone',p:'Ich liefere und hole nur in Saint-Brévin-les-Pins (44250) ab. Bitte wählen Sie eine Adresse aus der vorgeschlagenen Liste.',b:'Adresse korrigieren'}
      }[L];
      var m=document.createElement('div');
      m.id='oz-modal';
      m.style.cssText='position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(27,39,51,.7);backdrop-filter:blur(4px);padding:18px;';
      m.innerHTML='<div style="background:#fff;border:2px solid #c8902e;border-radius:18px;padding:30px 26px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);">'
        +'<div style="font-size:2.4rem;margin-bottom:10px;">📍</div>'
        +'<h3 style="font-family:Fraunces,serif;color:#1b2733;font-size:1.3rem;margin:0 0 12px;">'+T.t+'</h3>'
        +'<p style="color:#5b6b7a;font-size:.95rem;line-height:1.6;margin:0 0 22px;">'+T.p+'</p>'
        +'<button id="oz-close" style="background:#c8902e;color:#1b2733;font-weight:800;border:none;border-radius:999px;padding:13px 30px;cursor:pointer;width:100%;font-size:1rem;">'+T.b+'</button>'
        +'</div>';
      document.body.appendChild(m);
      function close(){
        m.remove();
        var origin = originMsgId==='shop-msg' ? document.getElementById('shop_name') : document.getElementById('address');
        if(origin){ origin.focus(); origin.scrollIntoView({behavior:'smooth',block:'center'}); origin.select && origin.select(); }
      }
      document.getElementById('oz-close').addEventListener('click',close);
      m.addEventListener('click',function(e){ if(e.target===m) close(); });
      document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc); } });
    }

    function initAll(){
      attachAutocomplete('address','address-msg','addressValid');
      attachAutocomplete('shop_name','shop-msg','shopValid');
      refreshLock(); // verrouille dès le départ tant que les 2 adresses ne sont pas validées
    }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',loadMaps);
    else loadMaps();
  })();
  </script>

</body>
