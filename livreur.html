<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Khéops — App Livreur</title>
  <meta name="theme-color" content="#0b3d2e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Khéops Livreur"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="logo.png"/>
  <link rel="icon" href="logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous"/>

  <style>
    :root {
      --gold: #c9a227; --gold-light: #e8c84a;
      --green-deep: #0b3d2e; --green-mid: #0b6e68; --green-accent: #2aa879;
      --red: #e8372a; --orange: #f57c00; --blue: #1565c0;
      --bg: #0b3d2e; --surface: #0d4a38; --card: #0f5540;
      --text: #ffffff; --muted: rgba(255,255,255,0.6);
      --radius: 18px; --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #0b3d2e, #0b6e68);
      padding: env(safe-area-inset-top, 12px) 16px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; background: rgba(255,255,255,0.1); padding: 4px; }
    .header-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; }
    .header-subtitle { font-size: 0.72rem; color: var(--muted); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 8px #4caf50; animation: pulse-green 2s infinite; }
    @keyframes pulse-green { 0%,100%{box-shadow:0 0 8px #4caf50} 50%{box-shadow:0 0 16px #4caf50} }

    /* ── MAIN ── */
    .main { padding: 16px 16px 100px; max-width: 500px; margin: 0 auto; }

    /* ── STATS BAR ── */
    .stats-bar {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface); border-radius: var(--radius-sm);
      padding: 12px; text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--gold-light); }
    .stat-label { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

    /* ── SECTION TITRE ── */
    .section-title {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--gold); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content:''; flex:1; height:1px; background:rgba(201,162,39,0.2); }

    /* ── COMMANDE CARD ── */
    .order-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 16px;
      margin-bottom: 12px;
      transition: transform 0.2s;
    }
    .order-card:active { transform: scale(0.98); }

    .order-card.status-pending  { border-left: 4px solid var(--gold); }
    .order-card.status-accepted { border-left: 4px solid var(--green-accent); }
    .order-card.status-enroute  { border-left: 4px solid var(--orange); }
    .order-card.status-delivered{ border-left: 4px solid #4caf50; opacity: 0.7; }

    .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .order-id { font-size: 0.7rem; color: var(--muted); }
    .order-time { font-size: 0.7rem; color: var(--muted); }
    .status-badge {
      padding: 3px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-pending   { background: rgba(201,162,39,0.2);  color: var(--gold-light); }
    .badge-accepted  { background: rgba(42,168,121,0.2);  color: #4caf50; }
    .badge-enroute   { background: rgba(245,124,0,0.2);   color: #ffb74d; }
    .badge-delivered { background: rgba(76,175,80,0.15);  color: #81c784; }

    .order-client { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .client-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green-mid), var(--green-accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; flex-shrink: 0;
    }
    .client-name { font-weight: 700; font-size: 0.95rem; }
    .client-address { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .order-details {
      background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px 12px;
      margin-bottom: 12px; font-size: 0.8rem; color: var(--muted); line-height: 1.8;
    }
    .order-details strong { color: var(--text); }
    .order-total { color: var(--gold-light); font-weight: 700; font-size: 0.9rem; }

    /* ── BOUTONS ACTION ── */
    .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-action {
      flex: 1; min-width: 100px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      font-size: 0.82rem; font-weight: 700; border: none; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-action:active { transform: scale(0.95); }

    .btn-accept  { background: linear-gradient(135deg, #2aa879, #0b6e68); color: #fff; box-shadow: 0 4px 14px rgba(42,168,121,0.4); }
    .btn-enroute { background: linear-gradient(135deg, #f57c00, #ef6c00); color: #fff; box-shadow: 0 4px 14px rgba(245,124,0,0.4); }
    .btn-deliver { background: linear-gradient(135deg, #2e7d32, #388e3c); color: #fff; box-shadow: 0 4px 14px rgba(46,125,50,0.4); }
    .btn-call    { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-cancel  { background: rgba(232,55,42,0.15); color: #ff6b5b; border: 1px solid rgba(232,55,42,0.3); }

    /* ── VIDE ── */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-state i { font-size: 3rem; opacity: 0.3; display: block; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; line-height: 1.6; }

    /* ── LOADING ── */
    .loading { text-align: center; padding: 32px; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 30px;
      font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none;
      transition: all 0.3s; z-index: 999; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: #1b5e20; }
    .toast.error   { background: #b71c1c; }

    /* ── NAV BAS ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--green-deep); border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; padding: 8px 0 env(safe-area-inset-bottom, 8px);
      z-index: 100;
    }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; color: var(--muted); font-size: 0.65rem; cursor: pointer; transition: color 0.2s; border: none; background: none; }
    .nav-btn i { font-size: 1.2rem; }
    .nav-btn.active { color: var(--gold-light); }

    /* ── ALERTE NOUVELLE COMMANDE ── */
    .new-order-alert {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 500;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; display: none;
    }
    .alert-box {
      background: var(--surface); border-radius: 24px; padding: 28px 24px;
      max-width: 340px; width: 100%; text-align: center;
      border: 2px solid var(--gold); box-shadow: 0 0 40px rgba(201,162,39,0.3);
      animation: alertPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes alertPop { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .alert-icon { font-size: 3rem; margin-bottom: 12px; animation: ring 1s infinite; }
    @keyframes ring { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
    .alert-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold-light); margin-bottom: 8px; }
    .alert-details { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 20px; }
    .alert-actions { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="header">
    <div class="header-left">
      <img src="logo.png" alt="Khéops" class="header-logo"/>
      <div>
        <div class="header-title">Khéops Livreur</div>
        <div class="header-subtitle" id="header-status">Chargement...</div>
      </div>
    </div>
    <div class="status-dot" id="connection-dot"></div>
  </header>

  <!-- ── ALERTE NOUVELLE COMMANDE ── -->
  <div class="new-order-alert" id="newOrderAlert">
    <div class="alert-box">
      <div class="alert-icon">🔔</div>
      <div class="alert-title">Nouvelle commande !</div>
      <div class="alert-details" id="alertDetails">Chargement...</div>
      <div class="alert-actions">
        <button class="btn-action btn-cancel" style="flex:1" onclick="dismissAlert()">
          <i class="fa fa-times"></i> Ignorer
        </button>
        <button class="btn-action btn-accept" style="flex:1" id="alertAcceptBtn">
          <i class="fa fa-check"></i> Accepter
        </button>
      </div>
    </div>
  </div>

  <!-- ── CONTENU PRINCIPAL ── -->
  <main class="main" id="mainContent">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">En attente</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statActive">0</div>
        <div class="stat-label">En cours</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statDelivered">0</div>
        <div class="stat-label">Livrées</div>
      </div>
    </div>

    <!-- Commandes actives -->
    <div class="section-title"><i class="fa fa-bolt"></i> Commandes actives</div>
    <div id="activeOrders">
      <div class="loading"><div class="spinner"></div><div style="font-size:0.82rem;color:var(--muted)">Connexion à Firebase...</div></div>
    </div>

    <!-- Historique -->
    <div class="section-title" style="margin-top:24px"><i class="fa fa-clock-rotate-left"></i> Historique aujourd'hui</div>
    <div id="historyOrders"></div>

  </main>

  <!-- ── NAVIGATION BAS ── -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="setTab('commandes')">
      <i class="fa fa-list"></i>Commandes
    </button>
    <button class="nav-btn" onclick="setTab('stats')">
      <i class="fa fa-chart-bar"></i>Stats
    </button>
    <button class="nav-btn" onclick="window.location.href='tel:0602019088'">
      <i class="fa fa-phone"></i>Appel
    </button>
  </nav>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast"></div>

  <!-- ── Firebase SDK ── -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue, off } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // ── CONFIG FIREBASE ──
    const firebaseConfig = {
      apiKey: "AIzaSyBlaEvC4p2aBwhjuPEeRKMXGu2KqCzfPhU",
      authDomain: "kheops-livraisons.firebaseapp.com",
      databaseURL: "https://kheops-livraisons-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kheops-livraisons",
      storageBucket: "kheops-livraisons.firebasestorage.app",
      messagingSenderId: "622316458078",
      appId: "1:622316458078:web:a1944ba19916ab02c8e4cf",
      measurementId: "G-X8PPY6G72Y"
    };

    // ── URL BACKEND VERCEL ──
    const API_URL = 'https://kehops-livraisons.vercel.app/api/orders';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // État local
    let allOrders = {};
    let lastOrderCount = 0;
    let alertOrderId = null;

    // ── ÉCOUTE TEMPS RÉEL FIREBASE ──
    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
      allOrders = snapshot.val() || {};
      renderOrders();
      checkNewOrders();
    });

    document.getElementById('header-status').textContent = 'Connecté • Temps réel';

    // ── RENDU DES COMMANDES ──
    function renderOrders() {
      const orders = Object.values(allOrders).sort((a, b) => b.createdAt - a.createdAt);

      // Stats
      const pending   = orders.filter(o => o.status === 'pending').length;
      const active    = orders.filter(o => ['accepted','enroute'].includes(o.status)).length;
      const delivered = orders.filter(o => o.status === 'delivered').length;
      document.getElementById('statPending').textContent   = pending;
      document.getElementById('statActive').textContent    = active;
      document.getElementById('statDelivered').textContent = delivered;

      // Commandes actives (pending + accepted + enroute)
      const activeOrders  = orders.filter(o => ['pending','accepted','enroute'].includes(o.status));
      const historyOrders = orders.filter(o => o.status === 'delivered');

      renderOrderList('activeOrders', activeOrders, true);
      renderOrderList('historyOrders', historyOrders, false);
    }

    function renderOrderList(containerId, orders, showActions) {
      const container = document.getElementById(containerId);
      if (orders.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa fa-inbox"></i><p>${containerId === 'activeOrders' ? 'Aucune commande en attente.<br>Tu peux te reposer ! 😊' : 'Aucune livraison effectuée aujourd\'hui.'}</p></div>`;
        return;
      }

      container.innerHTML = orders.map(order => `
        <div class="order-card status-${order.status}" id="card-${order.id}">
          <div class="order-header">
            <div>
              <div class="order-id">${order.id}</div>
              <div class="order-time">${formatTime(order.createdAt)}</div>
            </div>
            <span class="status-badge badge-${order.status}">${statusLabel(order.status)}</span>
          </div>

          <div class="order-client">
            <div class="client-avatar">${order.clientName.charAt(0).toUpperCase()}</div>
            <div>
              <div class="client-name">${order.clientName}</div>
              <div class="client-address"><i class="fa fa-map-marker-alt" style="font-size:0.7rem;margin-right:4px"></i>${order.clientAddress}</div>
            </div>
          </div>

          <div class="order-details">
            <strong>🍽 Restaurant :</strong> ${order.restaurant}<br>
            ${order.items && order.items.length > 0 ? `<strong>📦 Commande :</strong> ${order.items.map(i => i.name + (i.qty > 1 ? ' x'+i.qty : '')).join(', ')}<br>` : ''}
            <strong>📞 Tel :</strong> ${order.clientPhone}<br>
            <span class="order-total">💶 Total : ${order.total ? order.total.toFixed(2)+'€' : '—'} + ${order.deliveryFee}€ livraison</span>
          </div>

          ${showActions ? `<div class="order-actions">${getActionButtons(order)}</div>` : ''}
        </div>
      `).join('');

      // Attacher les événements
      if (showActions) {
        orders.forEach(order => {
          const card = document.getElementById('card-' + order.id);
          if (!card) return;

          card.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', () => handleAction(order.id, btn.dataset.action, order.clientPhone));
          });
        });
      }
    }

    function getActionButtons(order) {
      const callBtn = `<button class="btn-action btn-call" data-action="call"><i class="fa fa-phone"></i> Appeler</button>`;

      if (order.status === 'pending') {
        return `
          <button class="btn-action btn-accept" data-action="accepted"><i class="fa fa-check"></i> Accepter</button>
          <button class="btn-action btn-cancel" data-action="cancelled"><i class="fa fa-times"></i> Refuser</button>
          ${callBtn}
        `;
      }
      if (order.status === 'accepted') {
        return `
          <button class="btn-action btn-enroute" data-action="enroute"><i class="fa fa-motorcycle"></i> En route</button>
          ${callBtn}
        `;
      }
      if (order.status === 'enroute') {
        return `
          <button class="btn-action btn-deliver" data-action="delivered"><i class="fa fa-check-double"></i> Livré !</button>
          ${callBtn}
        `;
      }
      return callBtn;
    }

    // ── ACTIONS ──
    window.handleAction = async (orderId, action, phone) => {
      if (action === 'call') {
        window.location.href = 'tel:' + phone;
        return;
      }

      try {
        showToast('Mise à jour...', '');
        const res = await fetch(API_URL, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId, status: action })
        });

        const data = await res.json();
        if (data.success) {
          showToast(data.message, 'success');
        } else {
          showToast('Erreur : ' + data.error, 'error');
        }
      } catch (err) {
        showToast('Erreur réseau', 'error');
      }
    };

    // ── ALERTE NOUVELLE COMMANDE ──
    function checkNewOrders() {
      const pending = Object.values(allOrders).filter(o => o.status === 'pending');
      if (pending.length > lastOrderCount && lastOrderCount > 0) {
        const newOrder = pending[pending.length - 1];
        showNewOrderAlert(newOrder);
      }
      lastOrderCount = pending.length;
    }

    function showNewOrderAlert(order) {
      alertOrderId = order.id;
      document.getElementById('alertDetails').innerHTML = `
        <strong style="color:#fff;font-size:1rem">${order.clientName}</strong><br>
        📍 ${order.clientAddress}<br>
        🍽 ${order.restaurant}<br>
        💶 ${order.deliveryFee}€ de livraison
      `;
      document.getElementById('alertAcceptBtn').onclick = () => {
        handleAction(order.id, 'accepted', order.clientPhone);
        dismissAlert();
      };
      document.getElementById('newOrderAlert').style.display = 'flex';

      // Son de notification
      try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch(e) {}
    }

    window.dismissAlert = () => {
      document.getElementById('newOrderAlert').style.display = 'none';
      alertOrderId = null;
    };

    // ── UTILITAIRES ──
    function statusLabel(s) {
      return { pending:'En attente', accepted:'Acceptée', enroute:'En route', delivered:'Livrée', cancelled:'Annulée' }[s] || s;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.className = 'toast', 3000);
    }

    window.setTab = (tab) => {
      document.querySelectorAll('.nav-btn').forEach((b,i) => b.classList.toggle('active', i === ['commandes','stats','appel'].indexOf(tab)));
    };
  </script>
</body>
</html>
