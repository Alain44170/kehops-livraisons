<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khéops Livraisons — Maquette section services v4 (FR/EN/ES)</title>
<style>
  :root{
    --encre:#1b2733;
    --ecume:#f7f4ee;
    --sable:#e9e2d3;
    --ocre:#c8902e;
    --ardoise:#5b6b7a;
    --blanc:#ffffff;
    --vert:#2e7d52;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    background:var(--ecume);
    color:var(--encre);
    line-height:1.5;
  }

  /* ---- Sélecteur de langue ---- */
  .barre-langues{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:18px 16px 0;
    flex-wrap:wrap;
  }
  .btn-langue{
    background:var(--blanc);
    border:1.5px solid var(--sable);
    color:var(--encre);
    font-weight:600;
    font-size:.92rem;
    border-radius:999px;
    padding:10px 22px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-langue:hover{border-color:var(--ocre)}
  .btn-langue.actif{
    background:var(--encre);
    color:var(--ocre);
    border-color:var(--encre);
  }

  .section-services{
    max-width:1100px;
    margin:0 auto;
    padding:46px 24px 72px;
  }

  /* ---- En-tête ---- */
  .entete{
    text-align:center;
    max-width:680px;
    margin:0 auto 20px;
  }
  .surtitre{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:.8rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ocre);
    margin-bottom:14px;
  }
  .surtitre::before, .surtitre::after{
    content:"";
    width:0;height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:11px solid var(--ocre);
  }
  .entete h2{
    font-size:clamp(1.6rem, 4vw, 2.2rem);
    font-weight:700;
    letter-spacing:-.01em;
    margin-bottom:12px;
  }
  .entete p{
    color:var(--ardoise);
    font-size:1.05rem;
  }

  /* ---- Promesse ---- */
  .promesse{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:var(--blanc);
    border:1.5px solid var(--vert);
    color:var(--vert);
    font-weight:600;
    font-size:.95rem;
    border-radius:999px;
    padding:10px 22px;
    width:max-content;
    max-width:100%;
    margin:0 auto 44px;
    text-align:center;
  }
  .promesse svg{width:20px;height:20px;stroke:var(--vert);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* ---- Grille ---- */
  .grille{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media (max-width:900px){ .grille{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:480px){ .grille{grid-template-columns:1fr} }

  .carte{
    background:var(--blanc);
    border:1px solid var(--sable);
    border-radius:14px;
    padding:26px 22px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .carte:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 24px rgba(27,39,51,.10);
  }
  .carte .icone{
    width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    background:var(--ecume);
    border-radius:12px;
  }
  .carte .icone svg{
    width:26px;height:26px;
    stroke:var(--encre);
    stroke-width:1.8;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .carte h3{font-size:1.02rem;font-weight:700}
  .carte p{font-size:.9rem;color:var(--ardoise);flex-grow:1}
  .carte .tag{
    align-self:flex-start;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ocre);
  }

  /* ---- Parcours drive ---- */
  .parcours{
    margin-top:52px;
    background:var(--blanc);
    border:1px solid var(--sable);
    border-radius:16px;
    padding:34px 30px;
  }
  .parcours h3{
    font-size:1.25rem;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
  }
  .parcours > p{
    text-align:center;
    color:var(--ardoise);
    font-size:.95rem;
    margin-bottom:28px;
  }
  .etapes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
  }
  @media (max-width:760px){ .etapes{grid-template-columns:1fr} }
  .etape{
    position:relative;
    padding-left:54px;
  }
  .etape .num{
    position:absolute;
    left:0;top:0;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--encre);
    color:var(--ocre);
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;
  }
  .etape h4{font-size:.98rem;font-weight:700;margin-bottom:4px}
  .etape p{font-size:.88rem;color:var(--ardoise)}
  .etape p strong{color:var(--encre)}

  .astuce{
    margin-top:24px;
    background:var(--ecume);
    border-radius:12px;
    padding:14px 18px;
    font-size:.88rem;
    color:var(--ardoise);
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .astuce svg{width:18px;height:18px;stroke:var(--ocre);stroke-width:2;fill:none;flex-shrink:0;margin-top:2px;stroke-linecap:round;stroke-linejoin:round}
  .astuce strong{color:var(--encre)}

  /* ---- Formulaire en fenêtre modale ---- */
  .voile-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(27,39,51,.55);
    backdrop-filter:blur(3px);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .voile-modal.ouvert{display:flex}
  .demo-form{
    background:var(--blanc);
    border:1px solid var(--sable);
    border-radius:16px;
    padding:30px 28px;
    max-width:480px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    position:relative;
    animation:apparition .25s ease;
  }
  @keyframes apparition{
    from{opacity:0;transform:translateY(14px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .fermer-modal{
    position:absolute;
    top:14px;right:14px;
    width:34px;height:34px;
    border:none;
    border-radius:50%;
    background:var(--ecume);
    color:var(--ardoise);
    font-size:1.15rem;
    font-weight:700;
    cursor:pointer;
    line-height:1;
    transition:background .15s ease;
  }
  .fermer-modal:hover{background:var(--sable)}
  .demo-form h3{
    font-size:1.25rem;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
  }
  .demo-form > p{
    text-align:center;
    color:var(--ardoise);
    font-size:.95rem;
    margin-bottom:26px;
  }
  .champ-photo{
    background:var(--ecume);
    border:1.5px dashed var(--sable);
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
  }
  .champ-photo label{
    display:block;
    font-weight:700;
    font-size:.95rem;
    margin-bottom:10px;
  }
  .champ-photo input[type=file]{
    font-size:.88rem;
    color:var(--ardoise);
  }
  .champ-photo .apercu{
    display:none;
    margin-top:12px;
    align-items:center;
    gap:12px;
  }
  .champ-photo .apercu img{
    width:72px;height:72px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--sable);
  }
  .champ-photo .apercu .ok{
    color:var(--vert);
    font-weight:700;
    font-size:.9rem;
  }
  .rgpd{
    font-size:.78rem;
    color:var(--ardoise);
    margin:4px 0 18px;
  }
  .demo-form .cta{width:100%;}

  /* ---- Paiement intégré (style Stripe Elements) ---- */
  .paiement{
    background:var(--ecume);
    border:1px solid var(--sable);
    border-radius:12px;
    padding:20px 18px;
    margin:6px 0 16px;
  }
  .paiement h4{
    font-size:.95rem;
    font-weight:700;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .paiement h4 svg{width:17px;height:17px;stroke:var(--vert);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .paiement label{
    display:block;
    font-size:.8rem;
    font-weight:600;
    color:var(--ardoise);
    margin-bottom:5px;
    letter-spacing:.02em;
  }
  .paiement input{
    width:100%;
    border:1.5px solid var(--sable);
    border-radius:9px;
    background:var(--blanc);
    padding:12px 14px;
    font-size:1rem;
    font-family:inherit;
    color:var(--encre);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .paiement input:focus{
    border-color:var(--ocre);
    box-shadow:0 0 0 3px rgba(200,144,46,.15);
  }
  .paiement input::placeholder{color:#b6bec6}
  .ligne-carte{margin-bottom:12px}
  .ligne-double{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .mention-secu{
    font-size:.76rem;
    color:var(--ardoise);
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .mention-secu svg{width:13px;height:13px;stroke:var(--ardoise);stroke-width:2;fill:none;flex-shrink:0;stroke-linecap:round;stroke-linejoin:round}
  .succes-paiement{
    display:none;
    background:var(--vert);
    color:var(--blanc);
    border-radius:12px;
    padding:16px 20px;
    font-weight:700;
    text-align:center;
    margin-top:14px;
  }

  /* ---- Bandeau tarif ---- */
  .bandeau{
    margin-top:44px;
    background:var(--encre);
    color:var(--blanc);
    border-radius:16px;
    padding:30px 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .bandeau .texte strong{font-size:1.25rem;display:block}
  .bandeau .texte span{color:#aebbc7;font-size:.95rem}
  .bandeau .prix{
    font-size:2rem;
    font-weight:800;
    color:var(--ocre);
    white-space:nowrap;
  }
  .bandeau .prix small{
    font-size:.85rem;
    font-weight:600;
    color:#aebbc7;
    display:block;
    text-align:right;
  }
  .cta{
    background:var(--ocre);
    color:var(--encre);
    font-weight:700;
    font-size:1rem;
    border:none;
    border-radius:999px;
    padding:14px 28px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .cta:hover{filter:brightness(1.08)}
</style>
</head>
<body>

<div class="barre-langues">
  <button class="btn-langue actif" data-lang="fr" onclick="changerLangue('fr')">Version française</button>
  <button class="btn-langue" data-lang="en" onclick="changerLangue('en')">English version</button>
  <button class="btn-langue" data-lang="es" onclick="changerLangue('es')">Versión española</button>
</div>

<section class="section-services">

  <div class="entete">
    <div class="surtitre">Saint-Brévin-les-Pins</div>

  <div class="promesse">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>

  <div class="grille">

    <div class="carte">

    <div class="carte">

  <div class="parcours">

<div class="voile-modal" id="voileReservation" onclick="if(event.target===this)fermerReservation()">
  <div class="demo-form" id="reservation">

        <label for="nomCarte" data-i18n="pn"></label>
        <input type="text" id="nomCarte" autocomplete="cc-name" placeholder="Jean Dupont">
      </div>
      <div class="ligne-carte">

function changerLangue(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const cle = el.getAttribute('data-i18n');
    if (traductions[lang][cle] !== undefined) el.textContent = traductions[lang][cle];
  });
  document.querySelectorAll('.btn-langue').forEach(b => {
    b.classList.toggle('actif', b.getAttribute('data-lang') === lang);
  });
}

changerLangue('fr');

/* ---- Démo upload : compression + aperçu (identique au futur site) ---- */
function compresserImage(fichier, maxLargeur = 1280, qualite = 0.72) {
  return new Promise((resolve, reject) => {
    if (!fichier) { resolve(null); return; }
    const lecteur = new FileReader();
    lecteur.onerror = () => reject(new Error("Lecture impossible"));
    lecteur.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image illisible"));
      img.onload = () => {
        const ratio = Math.min(1, maxLargeur / img.width);
        const canvas = document.createElement("canvas");
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", qualite));
      };
      img.src = e.target.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

function brancherChampPhoto(idInput, idApercu) {
  document.getElementById(idInput).addEventListener("change", async (e) => {
    const apercu = document.getElementById(idApercu);
    const fichier = e.target.files[0];
    if (!fichier) { apercu.style.display = "none"; return; }
    try {
      const base64 = await compresserImage(fichier);
      apercu.querySelector("img").src = base64;
      apercu.style.display = "flex";
    } catch (err) {
      apercu.style.display = "none";
    }
  });
}
brancherChampPhoto("photoCommande", "apercuCommande");
brancherChampPhoto("photoFidelite", "apercuFidelite");

/* ---- Confort de saisie carte bancaire (comme sur le vrai formulaire) ---- */
document.getElementById("numCarte").addEventListener("input", e => {
  const chiffres = e.target.value.replace(/\D/g, "").slice(0, 16);
  e.target.value = chiffres.replace(/(\d{4})(?=\d)/g, "$1 ");
});
document.getElementById("expCarte").addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g, "").slice(0, 4);
  if (v.length >= 3) v = v.slice(0, 2) + "/" + v.slice(2);
  e.target.value = v;
});
document.getElementById("cvcCarte").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});

/* ---- Fenêtre modale de réservation ---- */
function ouvrirReservation() {
  document.getElementById("voileReservation").classList.add("ouvert");
  document.body.style.overflow = "hidden";
}
function fermerReservation() {
  clearTimeout(minuterieFermeture);
  document.getElementById("voileReservation").classList.remove("ouvert");
  document.body.style.overflow = "";
  reinitialiserFormulaire();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") fermerReservation();
});

/* ---- Paiement démo : confirmation 5 s, puis fermeture automatique ---- */
let minuterieFermeture = null;

function payerDemo() {
  const succes = document.getElementById("succesPaiement");
  document.getElementById("btnPayer").style.display = "none";
  succes.style.display = "block";
  succes.scrollIntoView({ behavior: "smooth", block: "center" });
  minuterieFermeture = setTimeout(fermerReservation, 5000);
}

function reinitialiserFormulaire() {
  document.getElementById("succesPaiement").style.display = "none";
  document.getElementById("btnPayer").style.display = "block";
  ["photoCommande","photoFidelite","nomCarte","numCarte","expCarte","cvcCarte"].forEach(id => {
    document.getElementById(id).value = "";
  });
  document.getElementById("apercuCommande").style.display = "none";
  document.getElementById("apercuFidelite").style.display = "none";
}
</script>
